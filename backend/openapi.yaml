openapi: 3.0.3
info:
  title: 1mg Challenge API
  version: 0.1.0
  description: |
    부산 하천 정책 체험용 API입니다. BOD 변화량은 게임용 데모 값이며
    실제 수질 개선을 예측하거나 보장하지 않습니다. 모든 HTTP 응답은
    `X-Request-ID` 헤더를 포함하며, 오류 응답의 `requestId`와 같은 값입니다.
servers:
  - url: http://127.0.0.1:8000
paths:
  /health:
    get:
      summary: 서버 상태 확인
      responses:
        '200':
          description: 정상
          content:
            application/json:
              schema:
                type: object
                required: [status, service]
                properties:
                  status: {type: string, example: ok}
                  service: {type: string, example: 1mg-challenge-api}
        '405': {$ref: '#/components/responses/MethodNotAllowed'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /api/game/config:
    get:
      summary: 게임 설정 조회
      responses:
        '200':
          description: 하천, 정책, 등급, 설문 선택지
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GameConfig'}
        '405': {$ref: '#/components/responses/MethodNotAllowed'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /api/simulations:
    post:
      summary: 정책 조합 계산
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SimulationRequest'}
      responses:
        '200':
          description: 서버가 계산한 결과
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SimulationResult'}
        '400': {$ref: '#/components/responses/ValidationError'}
        '405': {$ref: '#/components/responses/MethodNotAllowed'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /api/responses:
    post:
      summary: 익명 참여 결과 저장
      description: 계산 결과 필드는 받지 않으며 서버가 정책 ID로 다시 계산합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SubmissionRequest'}
      responses:
        '201':
          description: 저장 완료
          content:
            application/json:
              schema:
                type: object
                required: [id, createdAt, result]
                properties:
                  id: {type: string, format: uuid}
                  createdAt: {type: string, format: date-time}
                  result: {$ref: '#/components/schemas/SimulationResult'}
        '400': {$ref: '#/components/responses/ValidationError'}
        '405': {$ref: '#/components/responses/MethodNotAllowed'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '500': {$ref: '#/components/responses/InternalServerError'}
        '503': {$ref: '#/components/responses/DatabaseUnavailable'}
  /api/stats:
    get:
      summary: 시민 참여 통계 조회
      responses:
        '200':
          description: 전체, 하천별, 정책별 집계와 익명 의견
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Statistics'}
        '503': {$ref: '#/components/responses/DatabaseUnavailable'}
        '405': {$ref: '#/components/responses/MethodNotAllowed'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /api/candidate/report:
    get:
      summary: 후보자용 정책 리포트 데이터 조회
      responses:
        '200':
          description: 인쇄용 화면에 사용할 리포트 집계
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '503': {$ref: '#/components/responses/DatabaseUnavailable'}
        '405': {$ref: '#/components/responses/MethodNotAllowed'}
        '500': {$ref: '#/components/responses/InternalServerError'}
components:
  responses:
    ValidationError:
      description: 입력값 오류
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: object
                required: [code, message, details, requestId]
                properties:
                  code:
                    type: string
                    enum: [VALIDATION_ERROR, PERSONAL_INFORMATION_NOT_ALLOWED]
                  message: {type: string}
                  details:
                    type: array
                    items:
                      type: object
                      properties:
                        field: {type: string}
                        reason: {type: string}
                  requestId: {type: string, pattern: '^[0-9a-f]{32}$'}
    DatabaseUnavailable:
      description: 공유 데이터베이스 일시 장애
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: object
                required: [code, message, details, requestId]
                properties:
                  code: {type: string, enum: [DATABASE_UNAVAILABLE]}
                  message: {type: string}
                  details: {type: array, maxItems: 0}
                  requestId: {type: string, pattern: '^[0-9a-f]{32}$'}
    MethodNotAllowed:
      description: 지원하지 않는 HTTP 메서드
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    PayloadTooLarge:
      description: 요청 본문 크기 제한 초과
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    UnsupportedMediaType:
      description: application/json이 아닌 요청
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    InternalServerError:
      description: 예상하지 못한 서버 오류
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
  schemas:
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details, requestId]
          properties:
            code: {type: string}
            message: {type: string}
            details: {type: array, items: {type: object, additionalProperties: true}}
            requestId: {type: string, pattern: '^[0-9a-f]{32}$'}
    SimulationRequest:
      type: object
      additionalProperties: false
      required: [riverId, policyIds]
      properties:
        riverId:
          type: string
          enum: [dongcheon, goejeongcheon, oncheoncheon]
        policyIds:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [sewer, treatment, sourceBlock, ecology, sensor, monitoring, walking]
    SubmissionRequest:
      type: object
      additionalProperties: false
      required: [riverId, policyIds, topPriority, district, consentToAggregate]
      properties:
        riverId:
          type: string
          enum: [dongcheon, goejeongcheon, oncheoncheon]
        policyIds:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [sewer, treatment, sourceBlock, ecology, sensor, monitoring, walking]
        topPriority:
          type: string
          enum: [source_control, treatment, sensor, ecology, walking, citizen_monitoring]
        district:
          type: string
          enum: [geumjeong, dongnae, busanjin, saha, other, prefer_not]
        comment:
          type: string
          maxLength: 200
          description: 이름, 전화번호, 이메일, 주민등록번호, 정확한 주소와 HTML 태그를 포함할 수 없습니다.
        consentToAggregate: {type: boolean, enum: [true]}
    Grade:
      type: object
      required: [symbol, name, label, level]
      properties:
        symbol: {type: string, enum: [Ia, Ib, II, III, IV, V, VI]}
        name: {type: string}
        label: {type: string}
        maxBod: {type: number, nullable: true}
        level: {type: integer, minimum: 0, maximum: 6}
    SimulationResult:
      type: object
      additionalProperties: true
      required:
        - river
        - character
        - initialBod
        - finalBod
        - initialGrade
        - finalGrade
        - missionSuccess
        - perfectClear
        - policyOrder
        - budgetUsed
        - remainingBudget
        - scores
      properties:
        river:
          type: object
          properties:
            id: {type: string}
            name: {type: string}
        character: {type: string}
        initialBod: {type: number}
        finalBod: {type: number, minimum: 0.8}
        initialGrade: {$ref: '#/components/schemas/Grade'}
        finalGrade: {$ref: '#/components/schemas/Grade'}
        missionSuccess: {type: boolean}
        perfectClear: {type: boolean}
        policyOrder:
          type: array
          items: {type: string}
        budgetUsed: {type: integer, maximum: 100}
        remainingBudget: {type: integer, minimum: 0}
        scores:
          type: object
          properties:
            ecology: {type: integer, minimum: 0, maximum: 100}
            citizen: {type: integer, minimum: 0, maximum: 100}
            monitoring: {type: integer, minimum: 0, maximum: 100}
    GameConfig:
      type: object
      additionalProperties: true
      required: [version, maxBudget, grades, rivers, policies, priorities, districts, isDemoData]
      properties:
        version: {type: string}
        maxBudget: {type: integer, example: 100}
        grades:
          type: array
          items: {$ref: '#/components/schemas/Grade'}
        rivers: {type: array, items: {type: object, additionalProperties: true}}
        policies: {type: array, items: {type: object, additionalProperties: true}}
        priorities: {type: array, items: {type: object, additionalProperties: true}}
        districts: {type: array, items: {type: object, additionalProperties: true}}
        isDemoData: {type: boolean, enum: [true]}
    Statistics:
      type: object
      additionalProperties: true
      required:
        - totalParticipants
        - missionSuccessRate
        - perfectClearRate
        - averageGradeImprovement
        - riverParticipation
        - policySelection
        - comments
      properties:
        totalParticipants: {type: integer, minimum: 0}
        missionSuccessRate: {type: integer, minimum: 0, maximum: 100}
        perfectClearRate: {type: integer, minimum: 0, maximum: 100}
        averageGradeImprovement: {type: number}
        riverParticipation: {type: array, items: {type: object, additionalProperties: true}}
        policySelection: {type: array, items: {type: object, additionalProperties: true}}
        comments: {type: array, items: {type: object, additionalProperties: true}}

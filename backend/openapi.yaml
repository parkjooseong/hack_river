openapi: 3.0.3
info:
  title: 강 새로이 API
  version: 0.5.0
  description: |
    부산 하천 정책 체험용 API입니다. BOD 변화량은 게임용 데모 값이며
    실제 수질 개선을 예측하거나 보장하지 않습니다. 모든 HTTP 응답은
    `X-Request-ID` 헤더를 포함하며, 오류 응답의 `requestId`와 같은 값입니다.
servers:
  - url: http://127.0.0.1:8000
paths:
  /health:
    get:
      summary: 서버 상태 확인
      responses:
        '200':
          description: 정상
          content:
            application/json:
              schema:
                type: object
                required: [status, service, name]
                properties:
                  status: {type: string, example: ok}
                  service: {type: string, example: gang-saeroi-api}
                  name: {type: string, example: 강 새로이}
        '405': {$ref: '#/components/responses/MethodNotAllowed'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /api/game/config:
    get:
      summary: 게임 설정 조회
      responses:
        '200':
          description: 하천, 정책, 등급, 설문 선택지
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GameConfig'}
        '405': {$ref: '#/components/responses/MethodNotAllowed'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /api/simulations:
    post:
      summary: 정책 조합 계산
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SimulationRequest'}
      responses:
        '200':
          description: 서버가 계산한 결과
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SimulationResult'}
        '400': {$ref: '#/components/responses/ValidationError'}
        '405': {$ref: '#/components/responses/MethodNotAllowed'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /api/responses:
    post:
      summary: 익명 참여 결과 저장
      description: 계산 결과 필드는 받지 않으며 서버가 정책 ID로 다시 계산합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SubmissionRequest'}
      responses:
        '201':
          description: 저장 완료
          content:
            application/json:
              schema:
                type: object
                required: [id, createdAt, result]
                properties:
                  id: {type: string, format: uuid}
                  createdAt: {type: string, format: date-time}
                  result: {$ref: '#/components/schemas/SimulationResult'}
        '400': {$ref: '#/components/responses/ValidationError'}
        '405': {$ref: '#/components/responses/MethodNotAllowed'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '500': {$ref: '#/components/responses/InternalServerError'}
        '503': {$ref: '#/components/responses/DatabaseUnavailable'}
  /api/stats:
    get:
      summary: 시민 참여 통계 조회
      responses:
        '200':
          description: 전체, 하천별, 정책별 집계와 익명 의견
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Statistics'}
        '503': {$ref: '#/components/responses/DatabaseUnavailable'}
        '405': {$ref: '#/components/responses/MethodNotAllowed'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /api/candidate/report:
    get:
      summary: 후보자용 정책 리포트 데이터 조회
      description: 날짜 필터는 저장된 UTC 날짜를 기준으로 시작일과 종료일을 모두 포함합니다.
      parameters:
        - {$ref: '#/components/parameters/CandidateRiverId'}
        - {$ref: '#/components/parameters/CandidateDistrict'}
        - {$ref: '#/components/parameters/CandidateFromDate'}
        - {$ref: '#/components/parameters/CandidateToDate'}
      responses:
        '200':
          description: 인쇄용 화면에 사용할 리포트 집계
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CandidateReport'}
        '400': {$ref: '#/components/responses/ValidationError'}
        '503': {$ref: '#/components/responses/DatabaseUnavailable'}
        '405': {$ref: '#/components/responses/MethodNotAllowed'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /api/candidate/comments:
    get:
      summary: 후보자용 시민 의견 목록 조회
      description: 내용이 있는 익명 의견만 필터링해 페이지 단위로 제공합니다.
      parameters:
        - {$ref: '#/components/parameters/CandidateRiverId'}
        - {$ref: '#/components/parameters/CandidateDistrict'}
        - {$ref: '#/components/parameters/CandidateFromDate'}
        - {$ref: '#/components/parameters/CandidateToDate'}
        - name: page
          in: query
          schema: {type: integer, minimum: 1, default: 1}
        - name: pageSize
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
        - name: sort
          in: query
          schema: {type: string, enum: [latest, oldest], default: latest}
      responses:
        '200':
          description: 필터와 정렬이 적용된 의견 페이지
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CandidateCommentsPage'}
        '400': {$ref: '#/components/responses/ValidationError'}
        '503': {$ref: '#/components/responses/DatabaseUnavailable'}
        '405': {$ref: '#/components/responses/MethodNotAllowed'}
        '500': {$ref: '#/components/responses/InternalServerError'}
components:
  parameters:
    CandidateRiverId:
      name: riverId
      in: query
      schema:
        type: string
        enum: [dongcheon, goejeongcheon, oncheoncheon]
    CandidateDistrict:
      name: district
      in: query
      schema:
        type: string
        enum: [geumjeong, dongnae, busanjin, saha, other, prefer_not]
    CandidateFromDate:
      name: from
      in: query
      description: UTC 기준 시작일이며 해당 날짜를 포함합니다.
      schema: {type: string, format: date}
    CandidateToDate:
      name: to
      in: query
      description: UTC 기준 종료일이며 해당 날짜를 포함합니다.
      schema: {type: string, format: date}
  responses:
    ValidationError:
      description: 입력값 오류
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: object
                required: [code, message, details, requestId]
                properties:
                  code:
                    type: string
                    enum: [VALIDATION_ERROR, PERSONAL_INFORMATION_NOT_ALLOWED]
                  message: {type: string}
                  details:
                    type: array
                    items:
                      type: object
                      properties:
                        field: {type: string}
                        reason: {type: string}
                  requestId: {type: string, pattern: '^[0-9a-f]{32}$'}
    DatabaseUnavailable:
      description: 공유 데이터베이스 일시 장애
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: object
                required: [code, message, details, requestId]
                properties:
                  code: {type: string, enum: [DATABASE_UNAVAILABLE]}
                  message: {type: string}
                  details: {type: array, maxItems: 0}
                  requestId: {type: string, pattern: '^[0-9a-f]{32}$'}
    MethodNotAllowed:
      description: 지원하지 않는 HTTP 메서드
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    PayloadTooLarge:
      description: 요청 본문 크기 제한 초과
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    UnsupportedMediaType:
      description: application/json이 아닌 요청
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    InternalServerError:
      description: 예상하지 못한 서버 오류
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
  schemas:
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details, requestId]
          properties:
            code: {type: string}
            message: {type: string}
            details: {type: array, items: {type: object, additionalProperties: true}}
            requestId: {type: string, pattern: '^[0-9a-f]{32}$'}
    SimulationRequest:
      type: object
      additionalProperties: false
      description: 정책이 두 개 이상이고 eventChoice를 생략하면 event.status가 PENDING으로 반환됩니다.
      required: [riverId, policyIds]
      properties:
        riverId:
          type: string
          enum: [dongcheon, goejeongcheon, oncheoncheon]
        policyIds:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [sewer, treatment, sourceBlock, ecology, sensor, monitoring, walking]
        eventChoice:
          type: string
          enum: [INVESTIGATE, WAIT]
    SubmissionRequest:
      type: object
      additionalProperties: false
      description: 정책을 두 개 이상 선택한 최종 제출에는 eventChoice가 필요합니다.
      required: [riverId, policyIds, topPriority, district, consentToAggregate]
      properties:
        riverId:
          type: string
          enum: [dongcheon, goejeongcheon, oncheoncheon]
        policyIds:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [sewer, treatment, sourceBlock, ecology, sensor, monitoring, walking]
        eventChoice:
          type: string
          enum: [INVESTIGATE, WAIT]
        topPriority:
          type: string
          enum: [source_control, treatment, sensor, ecology, walking, citizen_monitoring]
        district:
          type: string
          enum: [geumjeong, dongnae, busanjin, saha, other, prefer_not]
        comment:
          type: string
          maxLength: 200
          description: 이름, 전화번호, 이메일, 주민등록번호, 정확한 주소와 HTML 태그를 포함할 수 없습니다.
        consentToAggregate: {type: boolean, enum: [true]}
    Grade:
      type: object
      required: [symbol, name, label, level]
      properties:
        symbol: {type: string, enum: [Ia, Ib, II, III, IV, V, VI]}
        name: {type: string}
        label: {type: string}
        maxBod: {type: number, nullable: true}
        level: {type: integer, minimum: 0, maximum: 6}
    Badge:
      type: object
      additionalProperties: false
      required: [id, name, description]
      properties:
        id:
          type: string
          enum:
            - GOOD_ACHIEVED
            - ONE_MG_PERFECT
            - ECOLOGY_RECOVERY
            - CITIZEN_EMPATHY
            - SMART_MANAGEMENT
            - BUDGET_SAVER
        name: {type: string}
        description: {type: string}
    Recommendation:
      type: object
      additionalProperties: false
      required:
        - policyId
        - policyName
        - cost
        - reason
        - expectedFinalBod
        - expectedFinalGrade
        - expectedFinalGradeLabel
        - expectedResultStatus
        - expectedMissionSuccess
        - expectedPerfectClear
        - expectedRemainingBudget
      properties:
        policyId:
          type: string
          enum: [sewer, treatment, sourceBlock, ecology]
        policyName: {type: string}
        cost: {type: integer, minimum: 0, maximum: 100}
        reason: {type: string}
        expectedFinalBod: {type: number, minimum: 0.8}
        expectedFinalGrade:
          type: string
          enum: [Ia, Ib, II, III, IV, V, VI]
        expectedFinalGradeLabel: {type: string}
        expectedResultStatus:
          type: string
          enum: [TRY_AGAIN, MISSION_COMPLETE, PERFECT_CLEAR]
        expectedMissionSuccess: {type: boolean}
        expectedPerfectClear: {type: boolean}
        expectedRemainingBudget: {type: integer, minimum: 0, maximum: 100}
    SimulationResult:
      type: object
      additionalProperties: true
      required:
        - river
        - character
        - initialBod
        - finalBod
        - initialGrade
        - finalGrade
        - resultStatus
        - resultTitle
        - resultMessage
        - missionSuccess
        - perfectClear
        - policyOrder
        - budgetUsed
        - remainingBudget
        - scores
        - event
        - badges
        - strengths
        - recommendations
      properties:
        river:
          type: object
          properties:
            id: {type: string}
            name: {type: string}
        character: {type: string}
        initialBod: {type: number}
        finalBod: {type: number, minimum: 0.8}
        bodReduction: {type: number, minimum: 0}
        initialGrade: {$ref: '#/components/schemas/Grade'}
        finalGrade: {$ref: '#/components/schemas/Grade'}
        gradeImprovement: {type: integer, minimum: 0, maximum: 6}
        resultStatus:
          type: string
          enum: [TRY_AGAIN, MISSION_COMPLETE, PERFECT_CLEAR]
        resultTitle: {type: string}
        resultMessage: {type: string}
        missionSuccess: {type: boolean}
        perfectClear: {type: boolean}
        remainingBodToMission: {type: number, minimum: 0}
        selectedPolicies:
          type: array
          items: {type: object, additionalProperties: true}
        policyOrder:
          type: array
          items: {type: string}
        budgetUsed: {type: integer, maximum: 100}
        remainingBudget: {type: integer, minimum: 0}
        scores:
          type: object
          properties:
            ecology: {type: integer, minimum: 0, maximum: 100}
            citizen: {type: integer, minimum: 0, maximum: 100}
            monitoring: {type: integer, minimum: 0, maximum: 100}
        event: {$ref: '#/components/schemas/EventResult'}
        selectedPledgeAreas:
          type: array
          uniqueItems: true
          items: {type: string, enum: [CLEAN UP, SMART UP, WALK UP]}
        pledgeMatchRate: {type: integer, minimum: 0, maximum: 100}
        badges:
          type: array
          uniqueItems: true
          items: {$ref: '#/components/schemas/Badge'}
        strengths:
          type: array
          minItems: 1
          items: {type: string}
        recommendations:
          type: array
          maxItems: 3
          items: {$ref: '#/components/schemas/Recommendation'}
        isDemoData: {type: boolean, enum: [true]}
        disclaimer: {type: string}
    GameConfig:
      type: object
      additionalProperties: true
      required:
        - serviceName
        - version
        - maxBudget
        - grades
        - rivers
        - policies
        - events
        - badgeDefinitions
        - resultStatuses
        - priorities
        - districts
        - isDemoData
      properties:
        serviceName: {type: string, example: 강 새로이}
        version: {type: string}
        maxBudget: {type: integer, example: 100}
        grades:
          type: array
          items: {$ref: '#/components/schemas/Grade'}
        rivers: {type: array, items: {type: object, additionalProperties: true}}
        policies: {type: array, items: {type: object, additionalProperties: true}}
        events:
          type: array
          minItems: 1
          items: {type: object, additionalProperties: true}
        badgeDefinitions:
          type: array
          minItems: 6
          maxItems: 6
          items: {$ref: '#/components/schemas/Badge'}
        resultStatuses:
          type: array
          minItems: 3
          maxItems: 3
          items:
            type: object
            additionalProperties: false
            required: [id, title, message]
            properties:
              id:
                type: string
                enum: [TRY_AGAIN, MISSION_COMPLETE, PERFECT_CLEAR]
              title: {type: string}
              message: {type: string}
        priorities: {type: array, items: {type: object, additionalProperties: true}}
        districts: {type: array, items: {type: object, additionalProperties: true}}
        isDemoData: {type: boolean, enum: [true]}
    Statistics:
      type: object
      additionalProperties: true
      required:
        - totalParticipants
        - missionSuccessRate
        - perfectClearRate
        - averageGradeImprovement
        - riverParticipation
        - policySelection
        - eventStatistics
        - commentKeywordAnalysis
        - comments
      properties:
        totalParticipants: {type: integer, minimum: 0}
        missionSuccessRate: {type: integer, minimum: 0, maximum: 100}
        perfectClearRate: {type: integer, minimum: 0, maximum: 100}
        averageGradeImprovement: {type: number}
        riverParticipation: {type: array, items: {type: object, additionalProperties: true}}
        policySelection: {type: array, items: {type: object, additionalProperties: true}}
        eventStatistics: {$ref: '#/components/schemas/EventStatistics'}
        commentKeywordAnalysis: {$ref: '#/components/schemas/CommentKeywordAnalysis'}
        comments: {type: array, items: {type: object, additionalProperties: true}}
    EventResult:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - triggerPolicyCount
        - status
        - choice
        - cost
        - scoreEffects
        - sensorAssisted
        - message
        - temporaryCharacterMood
      properties:
        id: {type: string, enum: [DOWNSTREAM_ODOR_SURGE]}
        name: {type: string}
        triggerPolicyCount: {type: integer, enum: [2]}
        status: {type: string, enum: [NOT_TRIGGERED, PENDING, RESOLVED]}
        choice: {type: string, enum: [INVESTIGATE, WAIT], nullable: true}
        cost: {type: integer, enum: [0, 5]}
        scoreEffects:
          type: object
          additionalProperties: false
          required: [ecology, citizen, monitoring]
          properties:
            ecology: {type: integer}
            citizen: {type: integer}
            monitoring: {type: integer}
        sensorAssisted: {type: boolean}
        message: {type: string, nullable: true}
        temporaryCharacterMood: {type: string, enum: [WORRIED], nullable: true}
    EventStatistics:
      type: object
      additionalProperties: false
      required:
        - eventId
        - eligibleParticipants
        - respondedParticipants
        - responseRate
        - choices
        - sensorAssistedInvestigations
      properties:
        eventId: {type: string, enum: [DOWNSTREAM_ODOR_SURGE]}
        eligibleParticipants: {type: integer, minimum: 0}
        respondedParticipants: {type: integer, minimum: 0}
        responseRate: {type: integer, minimum: 0, maximum: 100}
        choices:
          type: array
          minItems: 2
          maxItems: 2
          items: {type: object, additionalProperties: true}
        sensorAssistedInvestigations:
          type: object
          additionalProperties: false
          required: [count, rate]
          properties:
            count: {type: integer, minimum: 0}
            rate: {type: integer, minimum: 0, maximum: 100}
    CommentKeywordCategory:
      type: object
      additionalProperties: false
      required: [id, name, count, rate]
      properties:
        id:
          type: string
          enum:
            - ODOR
            - POLLUTION_SOURCE
            - DATA_DISCLOSURE
            - ECOLOGY_RESTORATION
            - WALKING_AMENITIES
            - OTHER
        name: {type: string}
        count: {type: integer, minimum: 0}
        rate: {type: integer, minimum: 0, maximum: 100}
    CommentKeywordAnalysis:
      type: object
      additionalProperties: false
      required:
        - totalComments
        - classificationMode
        - dictionaryVersion
        - categories
        - topCategories
      properties:
        totalComments: {type: integer, minimum: 0}
        classificationMode: {type: string, enum: [SINGLE_PRIMARY]}
        dictionaryVersion: {type: string}
        categories:
          type: array
          minItems: 6
          maxItems: 6
          items: {$ref: '#/components/schemas/CommentKeywordCategory'}
        topCategories:
          type: array
          maxItems: 3
          items: {$ref: '#/components/schemas/CommentKeywordCategory'}
    CandidateFilters:
      type: object
      additionalProperties: false
      required: [riverId, district, from, to]
      properties:
        riverId: {type: string, nullable: true}
        district: {type: string, nullable: true}
        from: {type: string, format: date, nullable: true}
        to: {type: string, format: date, nullable: true}
    CandidateComment:
      type: object
      additionalProperties: false
      required:
        - id
        - riverId
        - riverName
        - district
        - districtName
        - topPriority
        - topPriorityName
        - comment
        - createdAt
      properties:
        id: {type: string, format: uuid}
        riverId: {type: string}
        riverName: {type: string}
        district: {type: string}
        districtName: {type: string}
        topPriority: {type: string}
        topPriorityName: {type: string}
        comment: {type: string, maxLength: 200}
        createdAt: {type: string, format: date-time}
    CandidateReport:
      type: object
      additionalProperties: true
      required:
        - title
        - period
        - filters
        - summary
        - policySelection
        - topPriorities
        - pledgeAreaSelection
        - eventStatistics
        - commentKeywordAnalysis
        - perRiver
        - prioritiesByRiver
        - prioritiesByDistrict
        - comments
        - methodology
        - isDemoData
      properties:
        title: {type: string}
        period:
          type: object
          required: [from, to]
          properties:
            from: {type: string, format: date-time, nullable: true}
            to: {type: string, format: date-time, nullable: true}
        filters: {$ref: '#/components/schemas/CandidateFilters'}
        summary: {type: object, additionalProperties: true}
        policySelection: {type: array, items: {type: object, additionalProperties: true}}
        topPriorities: {type: array, items: {type: object, additionalProperties: true}}
        pledgeAreaSelection: {type: array, items: {type: object, additionalProperties: true}}
        eventStatistics: {$ref: '#/components/schemas/EventStatistics'}
        commentKeywordAnalysis: {$ref: '#/components/schemas/CommentKeywordAnalysis'}
        perRiver: {type: array, items: {type: object, additionalProperties: true}}
        prioritiesByRiver: {type: array, items: {type: object, additionalProperties: true}}
        prioritiesByDistrict: {type: array, items: {type: object, additionalProperties: true}}
        comments:
          type: array
          maxItems: 50
          items: {$ref: '#/components/schemas/CandidateComment'}
        methodology: {type: object, additionalProperties: true}
        isDemoData: {type: boolean, enum: [true]}
    CandidateCommentsPage:
      type: object
      additionalProperties: false
      required: [items, pagination, sort, filters, isDemoData]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/CandidateComment'}
        pagination:
          type: object
          additionalProperties: false
          required: [page, pageSize, totalItems, totalPages, hasNext, hasPrevious]
          properties:
            page: {type: integer, minimum: 1}
            pageSize: {type: integer, minimum: 1, maximum: 100}
            totalItems: {type: integer, minimum: 0}
            totalPages: {type: integer, minimum: 0}
            hasNext: {type: boolean}
            hasPrevious: {type: boolean}
        sort: {type: string, enum: [latest, oldest]}
        filters: {$ref: '#/components/schemas/CandidateFilters'}
        isDemoData: {type: boolean, enum: [true]}

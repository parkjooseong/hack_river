services:
  - type: web
    name: gang-saeroi-api
    runtime: python
    plan: free
    region: singapore
    branch: frontend
    rootDir: backend
    buildCommand: pip install -r requirements-dev.txt && python -m unittest discover -s tests -v
    startCommand: python -m river_api --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: STORAGE_BACKEND
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: CANDIDATE_AUTH_EMAIL
        sync: false
      - key: SUPABASE_AUTH_TIMEOUT_SECONDS
        value: "10"
      - key: SUPABASE_TABLE
        value: responses
      - key: SUPABASE_TIMEOUT_SECONDS
        value: "10"
      - key: ALLOWED_ORIGINS
        sync: false
      - key: BACKUP_POLICY_CONFIRMED
        sync: false
      - key: LOG_LEVEL
        value: INFO

  - type: web
    name: gang-saeroi-web
    runtime: static
    branch: frontend
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "24.13.0"
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: VITE_CANDIDATE_AUTH_EMAIL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
